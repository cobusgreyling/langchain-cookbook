[project]
name = "langchain-cookbook"
version = "1.0.0"
description = "Practical, self-contained recipes for building LLM applications with LangChain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Cobus Greyling"},
]

dependencies = [
    "langchain>=0.3.14",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.14",
    "langchain-chroma>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/cobusgreyling/langchain-cookbook"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
